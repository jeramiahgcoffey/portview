# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  # Reviews are on-demand only: no automatic review on PR open, and no
  # incremental review on pushes. Trigger manually by commenting
  # "@coderabbitai review" on a PR.
  auto_review:
    enabled: false
    drafts: false
  tools:
    golangci-lint:
      enabled: true
chat:
  auto_reply: true
